{% set LEFT_AXIS_WIDTH = 48 %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>TimeTable</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
<link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>


<body style="--left-axis-width: {{ LEFT_AXIS_WIDTH }}px" data-request-method="{{ request.method }}" data-has-diagram="{{ 'true' if selected_trains else 'false' }}">
    <main class="diagram-viewport" aria-label="{{ '希望到着' if direction == 'outbound' else '希望出発' }} {{ target_time }}">
    {% if selected_trains %}
        <div class="new-diagram-scroll" tabindex="0" aria-label="ダイヤをスクロール">
                <svg
                    id="timetable-diagram"
                    class="new-diagram"

                    width="{{ diagram_width + LEFT_AXIS_WIDTH + 40 }}"
                    height="{{ diagram_height }}"

                    viewBox="
                        0
                        0
                        {{ diagram_width + LEFT_AXIS_WIDTH + 40 }}
                        {{ diagram_height }}
                    "

                    data-left-axis-width="{{ LEFT_AXIS_WIDTH }}"
                    data-diagram-width="{{ diagram_width }}"
                    data-top-margin="{{ diagram_top_margin }}"
                    data-station-spacing="{{ diagram_station_spacing }}"
                    data-station-count="{{ diagram_stations|length }}"
                >


                    <!-- =========================
                         時間の縦線
                         ========================= -->
                    {% for tick in time_ticks %}

                        {% set tick_x =
                            LEFT_AXIS_WIDTH
                            + (tick.minutes - diagram_start_minutes)
                            * diagram_pixels_per_minute
                        %}

                        <line
                            x1="{{ tick_x }}"
                            y1="30"

                            x2="{{ tick_x }}"
                            y2="{{ diagram_height - 20 }}"

                            data-base-x="{{ tick_x }}"

                            class="diagram-time-grid"
                        />


                        <text
                            x="{{ tick_x }}"
                            y="18"

                            data-base-x="{{ tick_x }}"

                            text-anchor="middle"

                            class="diagram-time-label"
                        >
                            {{ tick.label }}
                        </text>

                    {% endfor %}


                    <!-- =========================
                         駅の横線
                         ========================= -->
                    {% for station in diagram_stations %}

                        {% set station_y =
                            diagram_top_margin
                            + loop.index0
                            * diagram_station_spacing
                        %}

                        <line
                            x1="{{ LEFT_AXIS_WIDTH }}"
                            y1="{{ station_y }}"

                            x2="{{ LEFT_AXIS_WIDTH + diagram_width }}"
                            y2="{{ station_y }}"

                            data-base-y="{{ station_y }}"

                            class="diagram-station-line"
                        />


                        <text
                            x="{{ LEFT_AXIS_WIDTH - 5 }}"
                            y="{{ station_y + 4 }}"

                            data-base-y="{{ station_y }}"

                            text-anchor="end"

                            class="diagram-station-name"
                        >
                            {{ station.name }}
                        </text>

                    {% endfor %}


                    <!-- =========================
                         希望到着時刻
                         ========================= -->
                    {% if direction == "outbound" and diagram_target_x is defined
                          and diagram_target_x is not none %}

                        {% set target_x =
                            diagram_target_x + LEFT_AXIS_WIDTH
                        %}

                        <line
                            x1="{{ target_x }}"
                            y1="30"

                            x2="{{ target_x }}"
                            y2="{{ diagram_height - 20 }}"

                            data-base-x="{{ target_x }}"

                            class="diagram-target-line"
                        />


                        <text
                            x="{{ target_x }}"
                            y="40"

                            data-base-x="{{ target_x }}"

                            text-anchor="middle"

                            class="diagram-target-label"
                        >
                            希望 {{ target_time }}
                        </text>

                    {% endif %}


                    <!-- =========================
                         全列車の線
                         ========================= -->
                    {% for train in diagram_trains %}

                        {% set train_index = loop.index0 %}


                        {% if train.train_type == "普通" %}

                            {% set train_class = "train-local" %}

                        {% elif train.train_type == "快速" %}

                            {% set train_class = "train-rapid" %}

                        {% elif train.train_type == "新快速" %}

                            {% set train_class = "train-special-rapid" %}

                        {% else %}

                            {% set train_class = "train-default" %}

                        {% endif %}


                        {% if train.points|length >= 2 %}

                            <polyline
                                points="
                                    {% for point in train.points %}
                                        {{ point.x + LEFT_AXIS_WIDTH }},{{ point.y }}
                                    {% endfor %}
                                "

                                data-base-points="{% for point in train.points %}{{ point.x + LEFT_AXIS_WIDTH }},{{ point.y }}{% if not loop.last %} {% endif %}{% endfor %}"

                                data-train-index="{{ train_index }}"
                                data-train-type="{{ train.train_type }}"
                                data-kobe-time="{{ train.kobe_time }}"

                                class="
                                    diagram-train-line
                                    {{ train_class }}
                                "
                            />

                        {% endif %}

                    {% endfor %}


                    <!-- =========================
                         駅情報ボックス
                         ========================= -->
                    <line id="transfer-line" class="diagram-transfer-line"
                          x1="0" y1="0" x2="0" y2="0" hidden />
                    {% for train in diagram_trains %}

                        {% set train_index = loop.index0 %}


                        {% if train.train_type == "普通" %}

                            {% set train_class = "train-local" %}

                        {% elif train.train_type == "快速" %}

                            {% set train_class = "train-rapid" %}

                        {% elif train.train_type == "新快速" %}

                            {% set train_class = "train-special-rapid" %}

                        {% else %}

                            {% set train_class = "train-default" %}

                        {% endif %}


                        {% for stop in train.stops %}

                            <g
                                class="diagram-stop-box"

                                data-train-index="{{ train_index }}"
                                data-train-type="{{ train.train_type }}"
                                data-kobe-time="{{ train.kobe_time }}"

                                data-base-x="{{ stop.x + LEFT_AXIS_WIDTH }}"
                                data-station="{{ stop.station }}"
                                data-arrival="{{ stop.arrival }}"
                                data-departure="{{ stop.departure }}"
                                data-base-y="{{ stop.y }}"
                                data-offset-y="{{ stop.offset_y or 0 }}"

                                transform="
                                    translate(
                                        {{ stop.x + LEFT_AXIS_WIDTH }}
                                        {{ stop.y + (stop.offset_y or 0) }}
                                    )
                                "
                            >


                                <!--
                                    同時刻の箱を上下に逃がした場合、
                                    本来の駅位置とのつながりを表示
                                -->
                                {% if stop.offset_y %}

                                    <line
                                        x1="0"
                                        y1="{{ -stop.offset_y }}"
                                        x2="0"
                                        y2="0"

                                        class="diagram-stop-leader"
                                    />

                                {% endif %}


                                <!-- 駅情報ボックス -->
                                <rect
                                    x="-17"
                                    y="-16"

                                    width="34"
                                    height="32"

                                    rx="2"
                                    ry="2"

                                    class="
                                        diagram-stop-rect
                                        {{ train_class }}
                                    "
                                />


                                <!-- 到着時刻 -->
                                {% if stop.arrival %}

                                    <text
                                        x="0"
                                        y="-7"

                                        text-anchor="middle"

                                        class="diagram-stop-arrival"
                                    >
                                        着 {{ stop.arrival }}
                                    </text>

                                {% endif %}


                                <!-- 駅名 -->
                                <text
                                    x="0"
                                    y="3"

                                    text-anchor="middle"

                                    class="diagram-stop-station"
                                >
                                    {{ stop.station }}
                                </text>


                                <!-- 発車時刻 -->
                                {% if stop.departure %}

                                    <text
                                        x="0"
                                        y="13"

                                        text-anchor="middle"

                                        class="diagram-stop-departure"
                                    >
                                        発 {{ stop.departure }}
                                    </text>

                                {% endif %}


                            </g>

                        {% endfor %}

                    {% endfor %}


                </svg>
        </div>
        <svg id="fixed-time-axis" aria-label="時刻"><g></g></svg>
        <svg id="fixed-station-axis" aria-label="駅名"><g></g></svg>
        <div class="axis-corner" aria-hidden="true"></div>
    {% endif %}
    </main>
    <div class="floating-controls" role="group" aria-label="ダイヤ操作">
        <button type="button" id="zoom-out" aria-label="縮小" {% if not selected_trains %}disabled{% endif %}>－</button>
        <span id="zoom-label" aria-live="polite">100%</span>
        <button type="button" id="zoom-in" aria-label="拡大" {% if not selected_trains %}disabled{% endif %}>＋</button>
        <button type="button" id="selection-reset" aria-label="列車選択と乗換候補をリセット" title="列車選択を解除" {% if not selected_trains %}disabled{% endif %}>リセット</button>
        <button id="menu-button" type="button" aria-label="メニューを開く" aria-controls="control-sheet" aria-expanded="false">☰</button>
    </div>
    <dialog id="control-sheet" aria-label="ダイヤの操作">
        <div class="sheet-heading"><span>ダイヤ</span><button id="close-sheet" type="button" aria-label="閉じる">×</button></div>
        <form method="POST" id="search-form">
            <fieldset class="direction-segment" aria-label="行き・帰り">
                <label><input type="radio" name="direction" value="outbound" {% if direction == 'outbound' %}checked{% endif %}><span>行き</span></label>
                <label><input type="radio" name="direction" value="return" {% if direction == 'return' %}checked{% endif %}><span>帰り</span></label>
            </fieldset>
            <label class="time-field" for="target_time">指定時刻
                <input type="time" id="target_time" name="target_time" value="{{ target_time }}" required>
            </label>
            {% if error_message %}<p class="error-message" role="alert">{{ error_message }}</p>{% endif %}
            <button class="search-button" type="submit">ダイヤを表示</button>
        </form>
    </dialog>
    <script src="{{ url_for('static', filename='controls.js') }}"></script>
    <script src="{{ url_for('static', filename='diagram.js') }}"></script>
</body>
</html>
